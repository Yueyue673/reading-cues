name: 网页兼容或使用体验
description: 提示、复制、编辑、开关或阅读负担方面的问题。
title: '[体验] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么，你原本期望什么
      description: 不需要提供诊断或个人身份；私人内容请用原创示例替代。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 可以怎样重现
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 插件版本、浏览器、系统、所选样式与数量
