<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻读 · 阅读提示</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="ui-common.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup">
  <div class="brand"><img src="icons/48.png" alt=""><div><b>轻读</b><small>READING CUES</small></div></div>
  <main>
    <span class="pill" id="site-label">全局自动运行中</span>
    <p class="site" id="site-name">正在读取…</p>
    <p class="hint">打开网页就自动提示，无需逐站开启。</p>
    <button id="site-toggle" class="primary" disabled>正在准备…</button>
    <p class="status" id="scan-status" aria-live="polite"></p>
    <fieldset><legend>提示样式</legend><div class="choices">
      <label class="choice"><input type="radio" name="style" value="background"><span class="preview-mark">浅底色</span></label>
      <label class="choice"><input type="radio" name="style" value="underline"><span class="preview-line">下划线</span></label>
    </div></fieldset>
    <p class="sample">这<span id="sample-cue" class="preview-mark">不一定</span>更快，但可以慢慢试。</p>
    <details><summary>提示数量与类别</summary><div class="stack">
      <label class="row" for="density">提示数量<select id="density"><option value="0">自动，随段落长度</option><option value="1">每段最多 1 组</option><option value="2">每段最多 2 组</option><option value="3">每段最多 3 组</option><option value="5">每段最多 5 组</option><option value="8">每段最多 8 组</option></select></label>
      <div id="category-choices" class="stack"></div>
      <p class="hint">默认自动分配数量，并保留完整表达。</p>
    </div></details>
    <hr class="divider">
    <label class="hint"><input type="checkbox" id="global-pause">暂停所有网站的提示</label>
    <p id="message" class="status" role="status"></p>
  </main>
  <footer>只在本地处理 · 不使用 AI 接口<div class="footer-links"><a href="options.html" target="_blank">个人词库与设置</a><a href="demo.html" target="_blank">打开试读页</a></div></footer>
</body></html>
