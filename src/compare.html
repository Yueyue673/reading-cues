<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻读 · 标记对照</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="pos-data.js" defer></script><script src="chunker.js" defer></script><script src="lexicon.js" defer></script><script src="comparison-data.js" defer></script><script src="renderer.js" defer></script><script src="compare.js" defer></script></head>
<body><main class="page">
  <header data-reading-cues-ignore><div class="brand"><img src="icons/48.png" alt=""><div><b>轻读</b><small>READING CUES</small></div></div><h1 style="margin-top:25px">先看标记是否合适。</h1><p>固定下划线，只比较选词和边界。新版“意义块”是候选方案，尚未验证阅读效果。</p><label class="stack" for="compare-sample">选择段落<select id="compare-sample"></select></label><p class="hint" id="sample-note"></p><div class="compare-toolbar" role="group" aria-label="标记方案"><button data-plan="original" aria-pressed="false">原文</button><button data-plan="words" aria-pressed="false">旧版分词</button><button data-plan="chunks" aria-pressed="true">新候选</button><button data-plan="personal" id="manual-plan" aria-pressed="false">你的标注</button></div><p id="compare-status" class="status" role="status"></p></header>
  <article class="comparison-article" id="compare-article" aria-label="对照文字"></article>
  <section data-reading-cues-ignore class="card"><h2>当前标记的完整片段</h2><div id="chosen-pieces" class="marked-list"></div><p class="hint">先看是否拆散意思、漏掉动作或标得太满。读得更快、理解更好和看着舒服需要分别观察。</p><details><summary>也试试自己的文字</summary><label for="compare-custom">只在本页处理，刷新后清除</label><textarea id="compare-custom" style="width:100%" rows="4" maxlength="8000"></textarea><button id="compare-use">放到上方比较</button></details></section>
  <footer data-reading-cues-ignore style="margin-top:25px"><p>前三段包含使用者提供的标注，属于校准样例。其余段落没有使用者标注，不作为“最佳算法”的证明。同文切换适合看差异；评估理解时，应轮换不同但难度相近的文章，避免重读记忆影响。</p><a href="demo.html">样式与颜色试读</a> · <a href="options.html">插件设置</a></footer>
</main></body></html>
