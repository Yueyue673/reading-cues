<!doctype html>
<html lang="zh-CN">

<title>活动预约说明 · 轻读演示示例</title>
<style>
  :root{color-scheme:light dark;font:20px/2 system-ui,"Microsoft YaHei",sans-serif;color:#263e34;background:#fffefa}
  *{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:32px 34px 40px}
  header{border-bottom:1px solid #dce2d7;margin-bottom:24px;padding-bottom:20px}
  header p{font-size:12px;letter-spacing:2px;color:#64766b;margin:0 0 8px}h1{font-size:28px;line-height:1.4;font-weight:600;margin:0}

<main>
  <header><p>演示示例 · 原创通知</p><h1>活动预约说明</h1></header>
  <article>
    <p>预约成功后，请在当天上午十点前到服务台提交材料。活动开始前，请再确认一次集合地点和联系电话。</p>
    <p id="cancellation">如果需要取消，请提前一天申请，平台不收取费用。只是更换联系人，可以在原订单中修改，不需要重新预约。</p>
    <p>这份通知中的截止时间是周五下午六点。超过截止时间，系统会关闭入口；请在提交后保存确认信息。</p>
  </article>
  <footer>用于展示实际标记；不代表阅读效果测试。</footer>
