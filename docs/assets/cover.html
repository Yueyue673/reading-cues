<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>轻读 · 实际使用案例</title>
<!-- Screenshot layout. capture-preview.mjs fills these images with actual browser captures. -->
<style>
  *{box-sizing:border-box}body{margin:0;width:1440px;background:#f4f4ec;color:#243e34;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
  .page{padding:44px 48px 30px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:42px;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;white-space:nowrap}.brand img{width:42px;height:42px}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:1.5px;color:#687a6b}
  .intro{flex:1}.eyebrow{font-size:12px;color:#687a6b;margin:0 0 7px;letter-spacing:1px}h1{font-size:32px;line-height:1.35;font-weight:600;margin:0 0 10px}.description{color:#5b7062;font-size:16px;margin:0;max-width:850px}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pane{overflow:hidden;border:1px solid #d5ddcd;border-radius:12px;background:#fffefa}
  .label{padding:16px 22px;border-bottom:1px solid #e0e5d8;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600}.step{font:12px system-ui;color:#6c7c6e;letter-spacing:1px}.pane:last-child .label{background:#e8eee2}
  .shot{display:block;width:100%;height:auto}.foot{display:flex;justify-content:space-between;margin-top:20px;font-size:13px;color:#647567}
</style>
<div class="page">
  <div class="heading">
    <div class="brand"><img src="mark.svg" alt=""><div>轻读<small>READING CUES</small></div></div>
    <div class="intro"><p class="eyebrow" id="eyebrow">01 / 网页自动标记</p><h1 id="title">同一份通知，开启前后。</h1><p class="description" id="description">默认用最浅一档的彩色底色标出部分词组。原文、字号和换行保持不变。</p></div>
  </div>
  <div class="panes">
    <section class="pane"><div class="label"><span class="step">01</span><span id="left-label">原文</span></div><img class="shot" id="left-shot" alt="原文实际截图"></section>
    <section class="pane"><div class="label"><span class="step">02</span><span id="right-label">开启自动标记</span></div><img class="shot" id="right-shot" alt="开启轻读后的实际截图"></section>
  </div>
  <div class="foot"><span id="note">默认设置 · 多色底色 · 强度 20%</span><span>原创演示文字 · 实际扩展截图</span></div>
</div>
</html>
